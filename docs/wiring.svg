<rect x="440" y="466" width="40" height="56" rx="4" fill="#212529"/>
<circle cx="460" cy="494" r="12" fill="#495057" stroke="#868e96" stroke-width="2"/>
<text x="386" y="490" font-size="13" font-weight="700" fill="#212529" text-anchor="end">Push button</text>
<text x="386" y="507" font-size="11" fill="#495057" text-anchor="end">hold to talk</text>
<text x="40" y="544" font-size="14" font-weight="700" fill="#212529">Connections</text>
<rect x="40" y="558" width="18" height="6" rx="3" fill="#e03131"/>
<text x="68" y="565" font-size="12" fill="#212529">INMP441 VDD</text>
<text x="168" y="565" font-size="12" font-weight="700" fill="#212529">→ 3V3</text>
<text x="268" y="565" font-size="11" fill="#868e96">3.3 V only, not 5 V</text>
<rect x="40" y="580" width="18" height="6" rx="3" fill="#343a40"/>
<text x="68" y="587" font-size="12" fill="#212529">INMP441 GND</text>
<text x="168" y="587" font-size="12" font-weight="700" fill="#212529">→ GND</text>
<text x="268" y="587" font-size="11" fill="#868e96"></text>
<rect x="40" y="602" width="18" height="6" rx="3" fill="#343a40"/>
<text x="68" y="609" font-size="12" fill="#212529">INMP441 L/R</text>
<text x="168" y="609" font-size="12" font-weight="700" fill="#212529">→ GND</text>
<text x="268" y="609" font-size="11" fill="#868e96">selects the left channel</text>
<rect x="40" y="624" width="18" height="6" rx="3" fill="#e8590c"/>
<text x="68" y="631" font-size="12" fill="#212529">INMP441 SCK</text>
<text x="168" y="631" font-size="12" font-weight="700" fill="#212529">→ GPIO4</text>
<text x="268" y="631" font-size="11" fill="#868e96">bit clock</text>
<rect x="40" y="646" width="18" height="6" rx="3" fill="#2f9e44"/>
<text x="68" y="653" font-size="12" fill="#212529">INMP441 WS</text>
<text x="168" y="653" font-size="12" font-weight="700" fill="#212529">→ GPIO5</text>
<text x="268" y="653" font-size="11" fill="#868e96">word select</text>
<rect x="40" y="668" width="18" height="6" rx="3" fill="#1971c2"/>
<text x="68" y="675" font-size="12" fill="#212529">INMP441 SD</text>
<text x="168" y="675" font-size="12" font-weight="700" fill="#212529">→ GPIO6</text>
<text x="268" y="675" font-size="11" fill="#868e96">data</text>
<rect x="40" y="690" width="18" height="6" rx="3" fill="#9c36b5"/>
<text x="68" y="697" font-size="12" fill="#212529">Button</text>
<text x="168" y="697" font-size="12" font-weight="700" fill="#212529">→ GPIO7 + GND</text>
<text x="268" y="697" font-size="11" fill="#868e96">internal pull-up</text>
<text x="68" y="719" font-size="12" fill="#212529">WS2812 LED</text>
<text x="168" y="719" font-size="12" font-weight="700" fill="#212529">→ GPIO48</text>
<text x="268" y="719" font-size="11" fill="#868e96">already on the board</text>
<text x="40" y="860" font-size="11" fill="#868e96">Pin positions follow the ESP32-S3-DevKitC-1 header. Clone boards move pins around and may swap the two USB ports,</text>
<text x="40" y="876" font-size="11" fill="#868e96">so go by the labels printed on yours. DevKitC-1 v1.1 puts the LED on GPIO38 instead of GPIO48.</text>
</svg>

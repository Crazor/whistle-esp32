name: ESP32-P4 firmware

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Pick the apps whose inputs changed. Anything under `shared` rebuilds them
  # all; a manual run always builds them all.
  changes:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.pick.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            shared: &shared
              - .github/workflows/esp32p4.yml
              - tools/check_sdkconfig.sh
              - esp32/components/**
              # The other apps use whistle_demo's partition table.
              - esp32/whistle_demo/partitions.csv
            whistle_demo:
              - *shared
              - esp32/whistle_demo/**
              - esp32/needle_demo/components/**
              - engine/**
            mic_test:
              - *shared
              - esp32/mic_test/**
            whistle_stt:
              - *shared
              - esp32/whistle_stt/**
              - esp32/needle_demo/components/**
              - engine/**
            wifi_test:
              - *shared
              - esp32/wifi_test/**
      - id: pick
        env:
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            apps='["whistle_demo","mic_test","whistle_stt","wifi_test"]'
          else
            apps="$(jq -c 'map(select(. != "shared"))' <<<"$CHANGES")"
          fi
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.app }}
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    # Same ESP-IDF version that setup-linux.sh installs.
    container: espressif/idf:v5.5.6
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.changes.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4

      # The model is flashed to its own partition and is not needed to build.
      - name: Build
        shell: bash
        working-directory: esp32/${{ matrix.app }}
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          idf.py set-target esp32p4
          idf.py build

      - name: Check sdkconfig.defaults took effect
        shell: bash
        run: tools/check_sdkconfig.sh esp32/${{ matrix.app }}

      - name: Size
        shell: bash
        working-directory: esp32/${{ matrix.app }}
        run: |
          . "$IDF_PATH/export.sh" >/dev/null
          idf.py size

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-esp32p4
          path: |
            esp32/${{ matrix.app }}/build/*.bin
            esp32/${{ matrix.app }}/build/*.elf
            esp32/${{ matrix.app }}/build/bootloader/bootloader.bin
            esp32/${{ matrix.app }}/build/partition_table/partition-table.bin
            esp32/${{ matrix.app }}/build/flasher_args.json
            esp32/${{ matrix.app }}/sdkconfig
          if-no-files-found: error

  # Post a fresh comment with download links for every PR build, so each push
  # gets its own record instead of overwriting the previous one.
  comment:
    needs: build
    if: >-
      always() && github.event_name == 'pull_request' &&
      needs.build.result != 'skipped' && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write
    # Fork PRs get a read-only token and cannot comment.
    continue-on-error: true
    steps:
      - uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const runId = context.runId;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${runId}`;
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { owner, repo, run_id: runId, per_page: 100 });
            const sha = process.env.HEAD_SHA;
            const lines = [
              `### ESP32-P4 firmware build for ${sha.slice(0, 7)}`,
              '',
              `Result: **${process.env.BUILD_RESULT}** ([workflow run](${runUrl}))`,
              '',
            ];
            if (artifacts.length) {
              lines.push('| Artifact | Size |', '| --- | --- |');
              for (const a of artifacts.sort((x, y) => x.name.localeCompare(y.name))) {
                const mib = (a.size_in_bytes / 1048576).toFixed(1);
                lines.push(`| [${a.name}](${runUrl}/artifacts/${a.id}) | ${mib} MiB |`);
              }
            } else {
              lines.push('No artifacts were uploaded.');
            }
            await github.rest.issues.createComment({
              owner, repo, issue_number: context.issue.number, body: lines.join('\n'),
            });
